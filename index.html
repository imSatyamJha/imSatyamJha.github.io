<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satyam Jha | Casting Director</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #ff4d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(13, 13, 13, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 65px;
            width: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        .nav-socials {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 10px;
            padding-left: 20px;
            border-left: 1px solid #333;
        }

        .nav-icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 50%;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-icon-link svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
            transition: fill 0.3s ease;
        }

        .nav-icon-link:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .nav-icon-link:hover svg {
            fill: #fff;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 5%;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero-content {
            flex: 1;
        }

        .hero-img-container {
            flex: 0 0 320px;
            text-align: center;
        }

        .hero-img-container img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .hero-photo-caption {
            margin-top: 15px;
        }

        .hero-photo-caption h3 {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .hero-photo-caption p {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 500;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 77, 77, 0.1);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .btn-group a {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            margin-right: 15px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid #444;
        }

        .btn-secondary:hover {
            border-color: #fff;
        }

        .projects-section {
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .projects-section h2.section-title {
            font-size: 2rem;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .project-category {
            margin-top: 40px;
        }

        .project-category h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .slider-container {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) #222;
        }

        .slider-container::-webkit-scrollbar {
            height: 6px;
        }

        .slider-container::-webkit-scrollbar-track {
            background: #161616;
            border-radius: 3px;
        }

        .slider-container::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        .slider-track {
            display: inline-flex;
            gap: 25px;
        }

        .slide-card {
            flex: 0 0 280px;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            white-space: normal;
            border: 1px solid #222;
            position: relative;
        }

        .slide-card:hover {
            transform: translateY(-5px);
            border-color: #444;
        }

        .slide-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
        }

        .badge-upcoming {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--accent);
            border: 1px solid var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .slide-card .card-content {
            padding: 20px;
        }

        .slide-card h4 {
            font-size: 1.15rem;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .slide-card p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0;
        }

        /* Footer Styles */
        footer {
            background: #121212;
            border-top: 1px solid #222;
            margin-top: 80px;
            padding: 60px 5% 30px 5%;
            color: var(--text-secondary);
        }

        .footer-container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .footer-col h4 {
            color: var(--text-primary);
            font-size: 1.15rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .footer-logo-img {
            height: 70px;
            width: auto;
            object-fit: contain;
            background: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .footer-col p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 12px;
        }

        .footer-col ul li a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .footer-col ul li a:hover {
            color: var(--accent);
        }

            max-width: 1300px;
            margin: 50px auto 0 auto;
            padding-top: 25
